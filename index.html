<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KasKelas - Dasbor Bendahara</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 KasKelas 11 RPL 1</h1>
        <p>Centang jika siswa sudah membayar kas mingguan. Data otomatis tersimpan di komputermu!</p>
        
        <table id="kasTable">
            <thead>
                <tr>
                    <th>Nama Siswa</th>
                    <th>Minggu 1</th>
                    <th>Minggu 2</th>
                    <th>Minggu 3</th>
                    <th>Minggu 4</th>
                </tr>
            </thead>
            <tbody>
                <!-- Daftar nama siswa akan dimasukkan secara otomatis oleh JavaScript -->
            </tbody>
        </table>

        <button id="resetBtn">Reset Data Bulan Ini</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
